[package]
name = "foxprox-egress"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
foxprox-core = { path = "../foxprox-core" }
foxprox-stack = { path = "../foxprox-stack" }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
foxprox-device = { path = "../foxprox-device" }

[dev-dependencies]
foxprox-cli = { path = "../foxprox-cli" }

[lib]
path = "src/lib.rs"
