[package]
name = "foxprox-smoltcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
foxprox-core = { path = "../foxprox-core" }
foxprox-runtime = { path = "../foxprox-runtime" }
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }

[dev-dependencies]
foxprox-device = { path = "../foxprox-device" }
