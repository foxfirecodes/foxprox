[package]
name = "foxprox-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
foxprox-audit = { path = "../foxprox-audit" }
foxprox-broker = { path = "../foxprox-broker" }
foxprox-config = { path = "../foxprox-config" }
foxprox-core = { path = "../foxprox-core" }
foxprox-device = { path = "../foxprox-device" }
foxprox-egress = { path = "../foxprox-egress" }
foxprox-flow = { path = "../foxprox-flow" }
foxprox-packet = { path = "../foxprox-packet" }
foxprox-proxy = { path = "../foxprox-proxy" }
foxprox-tcp = { path = "../foxprox-tcp" }

[target.'cfg(unix)'.dependencies]
foxprox-integrations = { path = "../foxprox-integrations" }
foxprox-inspect = { path = "../foxprox-inspect" }

[[bin]]
name = "foxproxsetup"
path = "src/bin/foxproxsetup.rs"

[dev-dependencies]
foxprox-dns = { path = "../foxprox-dns" }
serde_json = { workspace = true }
