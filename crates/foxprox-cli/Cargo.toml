[package]
name = "foxprox-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "foxprox"
path = "src/main.rs"

[dependencies]
foxprox-core = { path = "../foxprox-core" }
foxprox-device = { path = "../foxprox-device" }
foxprox-net = { path = "../foxprox-net" }
libc = "0.2"
nix = { version = "0.31", features = ["socket", "uio"] }
