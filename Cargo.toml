[workspace]
members = [
    "crates/foxprox-core",
    "crates/foxprox-packet",
    "crates/foxprox-broker",
    "crates/foxprox-audit",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/foxfirecodes/foxprox"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
