[workspace]
members = [
    "crates/foxprox-core",
    "crates/foxprox-device",
    "crates/foxprox-integrations",
    "crates/foxprox-launcher",
    "crates/foxprox-setup",
    "crates/foxprox-runtime",
    "crates/foxprox-smoltcp",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/foxfirecodes/foxprox"
rust-version = "1.80"
